name: Apply American Landscape hero image

on:
  push:
    branches:
      - website-pass-04-american-landscape
    paths:
      - .github/workflows/stage-american-landscape.yml

permissions:
  contents: write

jobs:
  apply-hero-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website branch
        uses: actions/checkout@v4
        with:
          ref: website-pass-04-american-landscape

      - name: Replace the hero image and update attribution records
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          from pathlib import Path

          index_path = Path("index.html")
          text = index_path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(?ms)^        <figure class="hero-figure">\n'
              r'.*?general-george-washington-resigning-commission\.jpg.*?'
              r'^        </figure>'
          )

          replacement = "\n".join([
              '        <figure class="hero-figure">',
              '          <img src="assets/images/charles-sheeler-american-landscape.jpg" width="1500" height="1164" alt="Charles Sheeler\'s painting American Landscape, depicting the Ford River Rouge plant with railcars, industrial buildings, conveyors, a smokestack, and reflections in water.">',
              '          <figcaption>',
              '            Charles Sheeler, <a href="https://www.moma.org/collection/works/79032"><cite>American Landscape</cite> (1930)</a>. The Museum of Modern Art, New York.',
              '          </figcaption>',
              '        </figure>',
          ])

          revised, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f"Expected one Trumbull hero figure; replaced {count}.")

          index_path.write_text(revised, encoding="utf-8")
          PY

          cat > ATTRIBUTIONS.md <<'EOF'
          # Image Attributions

          ## Charles Sheeler hero painting

          **Work:** Charles Sheeler, *American Landscape* (1930), oil on canvas, 24 × 31 in. (61 × 78.8 cm), The Museum of Modern Art, New York.

          - Collection record: <https://www.moma.org/collection/works/79032>
          - Credit line: Gift of Abby Aldrich Rockefeller; MoMA object no. 166.1934.
          - Source image: WikiArt, `American Landscape, 1930 by Charles Sheeler`.
          - Source file: <https://uploads1.wikiart.org/images/charles-sheeler/american-landscape-1930.jpg>
          - The website uses a local 1500 × 1164 pixel JPEG and does not hotlink the displayed image.
          - No rights or license status is asserted by this record.

          ## Archived John Trumbull painting

          **Work:** John Trumbull, *General George Washington Resigning His Commission* (1824), oil on canvas, United States Capitol Rotunda.

          - Source image: Wikimedia Commons, `File:General George Washington Resigning his Commission.jpg`
          - Source page: <https://commons.wikimedia.org/wiki/File:General_George_Washington_Resigning_his_Commission.jpg>
          - Source/photographer listed by Wikimedia Commons: Architect of the Capitol
          - Status: Public domain in the United States; Wikimedia Commons marks the faithful reproduction with the Creative Commons Public Domain Mark 1.0.
          - The repository retains a local web derivative, but it is no longer displayed as the website hero image.

          ## Samuel C. Rhodes headshot

          **Photographer:** Nick Chismar.

          **Copyright:** © Moravian University 2024.

          - Supplied by Samuel C. Rhodes and used with his authorization.
          - The repository contains a local web derivative; the source file is not published in the repository.
          - The public derivative preserves the square composition and has unnecessary camera and technical metadata removed.

          No license statement is asserted.

          ## Ronald Reagan classroom photograph

          **Subject:** President Ronald Reagan receiving computer-operation instruction while visiting Congress Heights Elementary School in Washington, D.C., March 12, 1984.

          **Credit:** AP Photo/Scott Applewhite.

          - Corroborating source: <https://www.csmonitor.com/USA/Education/2013/0426/A-Nation-at-Risk-How-much-of-apocalyptic-education-report-still-applies>
          - Exact photograph recovered from the prior Adobe Express academic website and stored as a local web derivative; it is not hotlinked.
          - Samuel C. Rhodes explicitly directed reuse from his prior academic website and stated that he accepts responsibility for its use.
          - Copyright may apply.

          This record does not characterize the photograph as public domain, rights-cleared, or licensed.
          EOF

      - name: Validate the controlled change
        shell: bash
        run: |
          set -euo pipefail

          test -f assets/images/charles-sheeler-american-landscape.jpg
          test "$(file --brief --mime-type assets/images/charles-sheeler-american-landscape.jpg)" = "image/jpeg"
          test "$(stat --format=%s assets/images/charles-sheeler-american-landscape.jpg)" -gt 100000

          python3 <<'PY'
          import struct
          from pathlib import Path

          index = Path("index.html").read_text(encoding="utf-8")
          assert index.count('assets/images/charles-sheeler-american-landscape.jpg') == 1
          assert 'assets/images/general-george-washington-resigning-commission.jpg' not in index
          assert index.count('https://www.moma.org/collection/works/79032') == 1
          assert '<cite>American Landscape</cite> (1930)' in index

          path = Path("assets/images/charles-sheeler-american-landscape.jpg")
          sof_markers = {
              0xC0, 0xC1, 0xC2, 0xC3,
              0xC5, 0xC6, 0xC7,
              0xC9, 0xCA, 0xCB,
              0xCD, 0xCE, 0xCF,
          }

          with path.open("rb") as handle:
              assert handle.read(2) == b"\xff\xd8"
              while True:
                  byte = handle.read(1)
                  if not byte:
                      raise AssertionError("JPEG dimensions not found")
                  if byte != b"\xff":
                      continue
                  while byte == b"\xff":
                      byte = handle.read(1)
                  marker = byte[0]
                  if marker in {0xD8, 0xD9}:
                      continue
                  segment_length = struct.unpack(">H", handle.read(2))[0]
                  if marker in sof_markers:
                      _, height, width = struct.unpack(">BHH", handle.read(5))
                      break
                  handle.seek(segment_length - 2, 1)

          assert (width, height) == (1500, 1164), (width, height)
          PY

      - name: Remove the temporary workflow and commit the finished change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/stage-american-landscape.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Replace hero with Charles Sheeler American Landscape"
          git push origin HEAD:website-pass-04-american-landscape
